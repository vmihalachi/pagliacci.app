<!doctype html>
<html lang="{{locale.lang}}" data-gel="2">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>{{notFound.metaTitle}}</title>
    <meta name="theme-color" content="#2D2A8A" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="lone">
      <span class="mark" data-mood="deadpan">{{portrait}}</span>
      <h1 data-not-found="title">{{notFound.title}}</h1>
      <p data-not-found="body">{{notFound.body}}</p>
      <a class="btn btn-solid" href="/" data-not-found="home">{{notFound.home}}</a>
      {{moreFrom}}
    </main>
    <script type="application/json" id="not-found-i18n">
      {{notFoundJson}}
    </script>
    <script type="module" src="/src/not-found.js"></script>
  </body>
</html>
